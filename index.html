<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>หอพักเต็มสมบัติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Palette: cool white with royal blue, deep navy, gold and coral accents inside a pastel gradient frame. Layout: side nav on desktop, scrolling tab strip on phone */
:root{
  --bg:#f6f8fc; --surface:#ffffff; --surface-2:#f2f5fa; --ink:#111c33; --muted:#6c7890; --line:#e6ebf3;
  --accent:#1f4bb8; --accent-ink:#ffffff; --accent-soft:#e7eefb; --gold:#1f4bb8; --gold-ink:#ffffff;
  --navy:#0f2552; --navy-2:#0a1b3f; --navy-ink:#f2f2ff; --lime:#c99a3b; --coral:#ef7672; --magenta:#c99a3b; --magenta-soft:#fbf3e2;
  --frame:linear-gradient(120deg,#c9dcf7 0%,#d9c8f3 38%,#efc6dd 70%,#f6d6c4 100%);
  --ok:#2fae55; --ok-soft:#e4f6ea; --warn:#dd7b2c; --warn-soft:#fdf1e6; --bad:#e0466a; --bad-soft:#fdeaf0;
  --idle:#8b95a1; --idle-soft:#eef1f4; --fix:#6a5bd8; --fix-soft:#efedfd;
  --water:#1f4bb8; --elec:#c99a3b;
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(19,32,46,.04),0 8px 24px rgba(19,32,46,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1424; --surface:#13203a; --surface-2:#1a2a48; --ink:#eef3fb; --muted:#9fb0c8; --line:#26375a;
  --accent:#7aa7ff; --accent-ink:#061430; --accent-soft:#16294f; --gold:#7aa7ff; --gold-ink:#061430;
  --navy:#0f2552; --navy-2:#0a1b3f; --navy-ink:#f2f2ff; --lime:#e2b866; --coral:#f48a86; --magenta:#e2b866; --magenta-soft:#3a2e16;
  --frame:linear-gradient(120deg,#1b2350 0%,#2a1e4f 45%,#3a1d3c 100%);
  --ok:#5fd488; --ok-soft:#163a26; --warn:#f3a160; --warn-soft:#3a2614; --bad:#ff8396; --bad-soft:#3d1a22;
  --idle:#8b95a1; --idle-soft:#1d2b3a; --fix:#aca0ff; --fix-soft:#25224a;
  --water:#7aa7ff; --elec:#e2b866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1424; --surface:#13203a; --surface-2:#1a2a48; --ink:#eef3fb; --muted:#9fb0c8; --line:#26375a;
  --accent:#7aa7ff; --accent-ink:#061430; --accent-soft:#16294f; --gold:#7aa7ff; --gold-ink:#061430;
  --navy:#0f2552; --navy-2:#0a1b3f; --navy-ink:#f2f2ff; --lime:#e2b866; --coral:#f48a86; --magenta:#e2b866; --magenta-soft:#3a2e16;
  --frame:linear-gradient(120deg,#1b2350 0%,#2a1e4f 45%,#3a1d3c 100%);
  --ok:#5fd488; --ok-soft:#163a26; --warn:#f3a160; --warn-soft:#3a2614; --bad:#ff8396; --bad-soft:#3d1a22;
  --idle:#8b95a1; --idle-soft:#1d2b3a; --fix:#aca0ff; --fix-soft:#25224a;
  --water:#7aa7ff; --elec:#e2b866; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.25rem;font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100%}
.side{min-width:0;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.brand .sub{font-size:.78rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;font-family:var(--f-mono)}
.side-foot{display:none}
main{padding-block:18px 48px;padding-inline:16px;min-width:0;max-width:1180px;width:100%}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr;grid-template-rows:1fr}
  .side{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:20px 18px 12px}
  nav.tabs{flex-direction:column;overflow:visible;padding:8px 12px}
  .tab{padding:10px 12px}
  .side-foot{display:block;margin-top:auto;padding:16px 18px;font-size:.78rem;color:var(--muted)}
  main{padding-inline:32px;padding-block:26px 64px}
}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;box-shadow:var(--shadow);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:2px}
.monthpick button{border:0;background:none;width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.monthpick button:hover{background:var(--surface-2);color:var(--ink)}
.monthpick span{min-width:128px;text-align:center;font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:.9rem}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel > h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface);padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat .k{font-size:.8rem;color:var(--muted);letter-spacing:.01em}
.stat .v{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:700;line-height:1.2;margin-top:2px}
.stat .s{font-size:.8rem;color:var(--muted)}
.stat.bad .v{color:var(--bad)}
.meter{height:6px;border-radius:9px;background:var(--idle-soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--gold)}
.tag{font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;padding:2px 9px;background:var(--surface-2);border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--muted)}
.p-fix{background:var(--fix-soft);color:var(--fix)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .grow b{font-weight:500}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.78rem;color:var(--muted);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);text-align:right}
td input:disabled{background:var(--surface-2);color:var(--muted)}
.warnText{color:var(--warn);font-size:.8rem}
.floors{display:flex;flex-direction:column;gap:10px}
.floor{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.floor .fl{font-size:.8rem;color:var(--muted);padding-top:12px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.floor.solo{grid-template-columns:1fr}
.cell .who{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--ink);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{border:1px solid transparent;border-radius:12px;padding:14px 8px;font-size:1.05rem;text-align:center;cursor:pointer;font-family:var(--f-display);font-weight:700;line-height:1.2}
.cell small{display:block;font-family:var(--f-body);font-weight:500;font-size:.7rem;margin-top:2px}
.cell:hover{border-color:var(--ink)}
.c-paid{background:var(--ok-soft);color:var(--ok)} .c-unpaid{background:var(--warn-soft);color:var(--warn)}
.c-overdue{background:var(--bad-soft);color:var(--bad)} .c-nobill{background:var(--accent-soft);color:var(--accent)}
.c-vacant{background:var(--surface-2);color:var(--muted)} .c-fix{background:var(--fix-soft);color:var(--fix)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid line{stroke:var(--line)}
.keys{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col > h3{display:flex;justify-content:space-between}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.82rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.fld .hint{font-size:.75rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.fld .check{color:var(--ink);white-space:nowrap}.fld .check input{width:auto;padding:0}
.modal{position:fixed;inset:0;background:rgba(20,16,10,.4);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.modal .box{background:var(--surface);border-radius:14px;width:100%;max-width:620px;padding:20px;margin-top:4vh;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.modal .box > header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.2rem;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.bill-items td:last-child{text-align:right}
.bill-total{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem;padding-top:6px}
pre.copy{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-body);font-size:.88rem;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
.loading{padding:40px 0;color:var(--muted)}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{display:flex;flex-direction:column;gap:12px;padding:22px}
.login .big{width:100%;justify-content:center;min-height:46px;font-size:1rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.app.locked .side nav,.app.locked .side-foot{display:none!important}
/* ---------- redesign layer ---------- */
h2{font-size:1.55rem;font-weight:600;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.side{background:var(--surface)}
.brand .mark{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:36px;height:36px;font-size:1.05rem;box-shadow:0 6px 14px rgba(31,75,184,.3)}
.brand h1{font-size:1.08rem;font-weight:600}
.tab{border-radius:12px;font-weight:500}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tab .badge{background:var(--coral);font-family:var(--f-display);font-weight:600;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;font-size:.72rem}
@media (min-width:900px){.side{border-right:0;box-shadow:1px 0 0 var(--line)} main{padding-inline:36px;padding-block:28px 64px}}
.btn{border-radius:12px;font-family:var(--f-display);font-weight:500;box-shadow:none;border-color:var(--line)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(31,75,184,.28)}
.btn.primary:hover{color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.white{background:#fff;color:var(--accent);border-color:#fff;font-weight:600;border-radius:99px;padding:8px 18px}
.monthpick{border-radius:99px;box-shadow:none;padding:3px}
.monthpick button{border-radius:99px}
.monthpick span{font-family:var(--f-display);font-weight:500}
.panel,.stat,.tablewrap,.card{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.panel{padding:22px}
.banner{border-radius:16px}
.banner.info{background:var(--accent-soft)}
.tag{background:var(--surface-2);border-radius:10px;font-family:var(--f-display);font-weight:500}
.pill{font-weight:500;padding:3px 10px 3px 8px;display:inline-flex;align-items:center;gap:6px;border-radius:8px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{border-radius:99px;font-family:var(--f-display)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
th{background:transparent;font-family:var(--f-display);font-weight:500;font-size:.8rem;padding-block:14px}
th,td{padding-inline:16px;border-color:var(--line)}
td{padding-block:14px}
tbody tr:hover{background:var(--surface-2)}
.stat .v{font-family:var(--f-display);font-weight:600}
.meter{height:8px;background:var(--surface-2)}
.meter i{background:var(--accent);border-radius:9px}
.card{padding:18px}
.col{background:transparent;border:0;padding:0}
.col > h3{padding:0 4px}
.modal .box{border-radius:22px}
.fld input,.fld select,.fld textarea{border-radius:12px}
.toast{border-radius:99px;background:var(--navy);color:var(--navy-ink)}
.cell{border-radius:16px;font-family:var(--f-display);font-weight:600}
.c-paid{background:var(--ok-soft);color:var(--ok)} .c-unpaid{background:var(--warn-soft);color:var(--warn)}
.c-overdue{background:var(--bad-soft);color:var(--bad)} .c-nobill{background:#e9f0f7;color:#3d6a92}
.c-vacant{background:var(--surface-2);color:var(--muted)} .c-fix{background:var(--fix-soft);color:var(--fix)}

/* avatars */
.av{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:.95rem;flex:none}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:.8rem}
.av.a0{background:#fbe4ec;color:#b8365f}.av.a1{background:#e8ecf1;color:#4b5866}.av.a2{background:#fde4d4;color:#b2541c}
.av.a3{background:#dff3e5;color:#23803f}.av.a4{background:#e2edf9;color:#2f6aa6}.av.a5{background:#f3e5fb;color:#8340a8}
.avstack{display:flex}.avstack .av{border:3px solid var(--navy);margin-left:-10px;border-radius:50%}.avstack .av:first-child{margin-left:0}
.avstack .more{background:#fff;color:var(--navy)}
.avstack .av{border-color:var(--navy)}

/* dashboard hero (from the HRM header) */
.hero{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:18px;align-items:stretch}
.hero-photo{position:relative;border-radius:var(--r);overflow:hidden;min-height:280px;box-shadow:var(--shadow);background:var(--navy)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:50% 62%}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,32,46,0) 35%,rgba(19,32,46,.82) 100%)}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  if (/Failed to fetch|network/i.test(m)) return 'บันทึกไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองใหม่';
  return 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
}
async function put(col, id, data) {
  if (readOnly) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return false; }
  const before = S[col][id];
  S[col] = {...S[col], [id]: data}; scheduleRender();
  if (mode === 'cloud') {
    const {error} = await sb.from('docs').upsert({col, id, data, updated_at: new Date().toISOString()});
    if (error) { const o = {...S[col]}; if (before) o[id] = before; else delete o[id]; S[col] = o; scheduleRender(); toast(cloudErr(error)); return false; }
  } else saveLocal();
  return true;
}
async function remove(col, id) {
  if (readOnly) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return false; }
  const before = S[col][id];
  const o = {...S[col]}; delete o[id]; S[col] = o; scheduleRender();
  if (mode === 'cloud') {
    const {error} = await sb.from('docs').delete().match({col, id});
    if (error) { S[col] = {...S[col], [id]: before}; scheduleRender(); toast(cloudErr(error)); return false; }
  } else saveLocal();
  return true;
}
async function loadAll() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const {data, error} = await sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) break;
  }
  const fresh = {}; COLS.forEach(c => fresh[c] = {});
  rows.forEach(r => { if (fresh[r.col]) fresh[r.col][r.id] = r.data; });
  COLS.forEach(c => S[c] = fresh[c]);
}
async function putMany(rows) {
  for (let i = 0; i < rows.length; i += 400) {
    const {error} = await sb.from('docs').upsert(rows.slice(i, i + 400).map(r => ({...r, updated_at: new Date().toISOString()})));
    if (error) throw error;
  }
}
let channel = null;
function subscribeCloud() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('docs-live').on('postgres_changes', {event: '*', schema: 'public', table: 'docs'}, p => {
    if (p.eventType === 'DELETE') { const r = p.old || {}; if (S[r.col] && r.id in S[r.col]) { const o = {...S[r.col]}; delete o[r.id]; S[r.col] = o; } }
    else { const r = p.new || {}; if (S[r.col]) S[r.col] = {...S[r.col], [r.id]: r.data}; }
    scheduleRender();
  }).subscribe();
}

const readingOf = (roomId, m) => S.readings[roomId + '_' + m];
function prevReading(room, m) {
  let best = null;
  for (const rd of Object.values(S.readings)) if (rd.roomId === room.id && rd.month < m && (!best || rd.month > best.month)) best = rd;
  return best ? {water: +best.water, elec: +best.elec, month: best.month} : {water: +room.startWater || 0, elec: +room.startElec || 0, month: null};
}
function usage(room, m) {
  const cur = readingOf(room.id, m); if (!cur) return null;
  const p = prevReading(room, m);
  return {w: round2(cur.water - p.water), e: round2(cur.elec - p.elec), prev: p, cur};
}

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function fmtAxis(v) { return v >= 1000 ? (v / 1000).toLocaleString('th-TH', {maximumFractionDigits: 1}) + 'k' : String(Math.round(v)); }
function barChart(data, colors, dual) {
  const W = 560, H = 210, L = 44, R = dual ? 44 : 8, T = 12, B = 28, iw = W - L - R, ih = H - T - B;
  const maxes = dual ? [niceMax(Math.max(...data.map(d => d.v[0]))), niceMax(Math.max(...data.map(d => d.v[1])))] : [niceMax(Math.max(...data.flatMap(d => d.v)))];
  const gw = iw / data.length, bw = Math.min(26, gw * 0.32);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><g class="grid">`;
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - ih * i / 4;
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    s += `<text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtAxis(maxes[0] * i / 4)}</text>`;
    if (dual) s += `<text x="${W - R + 6}" y="${y + 4}">${fmtAxis(maxes[1] * i / 4)}</text>`;
  }
  s += '</g>';
  data.forEach((d, gi) => {
    const cx = L + gw * gi + gw / 2;
    d.v.forEach((v, si) => {
      const mx = dual ? maxes[si] : maxes[0], h = Math.max(0, ih * v / mx), x = cx - bw - 2 + si * (bw + 4);
      s += `<rect x="${x}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${colors[si]}"><title>${esc(d.label)}: ${baht(v)}</title></rect>`;
    });
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return s + '</svg>';
}
function roomMap(m) {
  const floors = {};
  rooms().forEach(r => { const f = r.floor || '-'; (floors[f] = floors[f] || []).push(r); });
  const keys = Object.keys(floors).sort((a, b) => String(a).localeCompare(String(b), 'th', {numeric: true}));
  const one = keys.length === 1;
  const cells = keys.map(f => `<div class="floor ${one ? 'solo' : ''}">${one ? '' : `<div class="fl">ชั้น ${esc(f)}</div>`}<div class="rooms">${floors[f].map(r => {
    const st = roomState(r), tn = tenantOf(r.id); let c = 'vacant', t = 'ว่าง';
    if (st === 'fix') { c = 'fix'; t = 'ปิดซ่อม'; }
    else if (st === 'occ') { const b = billOf(r.id, m); if (!b) { c = 'nobill'; t = 'ยังไม่ออกบิล'; } else { c = billState(b); t = BILL_PILL[c][1]; } }
    return `<button class="cell c-${c}" data-act="room" data-id="${r.id}">${esc(r.no)}<span class="who">${tn ? esc(tn.name) : '&nbsp;'}</span><small>${t}</small></button>`;
  }).join('')}</div></div>`).join('');
  return `<div class="floors">${cells}</div><div class="legend"><span><i class="c-paid"></i>จ่ายแล้ว</span><span><i class="c-unpaid"></i>รอชำระ</span><span><i class="c-overdue"></i>เลยกำหนด</span><span><i class="c-nobill"></i>ยังไม่ออกบิล</span><span><i class="c-vacant"></i>ว่าง</span><span><i class="c-fix"></i>ปิดซ่อม</span></div>`;
}

async function roomSave(id) {

const addonChecks = (sel, pre) => { const st = settings(); return ADDONS.map(a => `<label class="check"><input type="checkbox" id="${pre}-${a.key}" name="addon_${a.key}" ${sel[a.key] ? 'checked' : ''}> ${a.label} +${baht(st[a.fee])} บาท</label>`).join(''); };
const addonsFrom = d => Object.fromEntries(ADDONS.map(a => [a.key, !!d['addon_' + a.key]]));
function parseRoomNos(text) {
  const out = [];
  for (const part of String(text).split(/[,\s]+/).filter(Boolean)) {
    const m = part.match(/^(.*?)(\d+)-(?:\1)?(\d+)$/);
    if (m && +m[3] >= +m[2] && +m[3] - +m[2] < 200) { for (let n = +m[2]; n <= +m[3]; n++) out.push(m[1] + String(n).padStart(m[2].length, '0')); }
    else out.push(part);
  }
  return [...new Set(out)];
}
function bulkForm() {
  const st = settings();

  </form>

async function bulkSave() {
  const f = $('#bulkF'); if (!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f));
  const have = new Set(rooms().map(r => r.no)), nos = parseRoomNos(d.nos).filter(x => !have.has(x));

  if (nos.length > 200) { toast('สร้างได้ครั้งละไม่เกิน 200 ห้อง'); return; }
  const addons = addonsFrom(d); closeModal(); let n = 0;
  for (const no of nos) if (await put('rooms', 'r' + uid(), {no, floor: roomFloorGuess(no), type: '', rent: +d.rent || 0, startWater: 0, startElec: 0, maintenance: false, note: '', addons})) n++;
  toast(`สร้างห้องแล้ว ${n} ห้อง แก้ไขเลขห้องหรือส่วนเสริมได้ทีละห้อง`);
}

// ตั้ง 16 ห้องของหอ (175/1–175/16) ให้อัตโนมัติครั้งแรก
// และเปลี่ยนเลขห้องตัวอย่าง 101–208 ที่ยังไม่ได้ใช้งานเป็นเลขจริง
async function autoSetupRooms() {
  const st = S.settings.main || {};
  if (readOnly || st.sample || st.roomsSeeded) return;
  const nos = parseRoomNos(DEFAULT_ROOM_NOS), rs = rooms();
  const oldDefault = parseRoomNos('101-108, 201-208');
  const untouched = rs.length === 16 && rs.every((r, i) => r.no === oldDefault[i]) && !Object.keys(S.tenants).length && !Object.keys(S.readings).length && !Object.keys(S.bills).length;
  if (rs.length && !untouched) return;
  const rent = +settings().defaultRent || 0;
  if (untouched) { for (let i = 0; i < 16; i++) if (!await put('rooms', rs[i].id, {...S.rooms[rs[i].id], no: nos[i], floor: ''})) return; }
  else for (let i = 0; i < nos.length; i++) {
    if (!await put('rooms', 'r175-' + (i + 1), {no: nos[i], floor: '', type: '', rent, startWater: 0, startElec: 0, maintenance: false, note: '', addons: {}})) return;
  }
  await put('settings', 'main', {...(S.settings.main || {}), roomsSeeded: true});
}

  }).join('')}</tbody></table></div><p class="small muted">พิมพ์เลขมิเตอร์แล้วกด Tab หรือแตะช่องอื่น ระบบจะบันทึกเองเมื่อกรอกครบทั้งน้ำและไฟ ห้องที่ออกบิลแล้วจะแก้เลขไม่ได้ ถ้าต้องแก้ให้ลบบิลนั้นก่อน</p>`

async function saveMeterRow(tr) {

}
async function genBills() {
  const m = ui.month, st = settings(); let n = 0;
  for (const r of rooms()) {
    const t = tenantOf(r.id), u = usage(r, m);
    if (!t || !u || billOf(r.id, m)) continue;
    const items = [{label: 'ค่าเช่าห้อง', amount: +r.rent || 0},
      {label: `ค่าน้ำ ${baht(u.w)} หน่วย × ${baht(st.waterRate)}`, amount: round2(Math.max(u.w * st.waterRate, +st.waterMin || 0))},
      {label: `ค่าไฟ ${baht(u.e)} หน่วย × ${baht(st.elecRate)}`, amount: round2(u.e * st.elecRate)}];
    roomAddons(r).forEach(a => { if (+st[a.fee] > 0) items.push({label: a.bill || 'ค่า' + a.label, amount: +st[a.fee]}); });
    if (+st.commonFee > 0) items.push({label: 'ค่าส่วนกลาง', amount: +st.commonFee});
    if (+st.internetFee > 0) items.push({label: 'ค่าอินเทอร์เน็ต', amount: +st.internetFee});
    const bill = {roomId: r.id, roomNo: r.no, tenantId: t.id, tenantName: t.name, month: m, items, waterUnits: u.w, elecUnits: u.e,
      dueDate: addMonths(m, 1) + '-' + p2(Math.min(28, Math.max(1, +st.dueDay || 5))), status: 'unpaid', createdAt: todayStr(), no: 'INV' + m.replace('-', '') + '-' + r.no};
    bill.total = billTotal(bill);
    if (await put('bills', r.id + '_' + m, bill)) n++;
  }
  toast(n ? `ออกบิล ${n} ห้องแล้ว` : 'ไม่มีห้องที่พร้อมออกบิล');
}

  </form><div class="actions" style="margin-top:14px"><button class="btn primary" data-act="saveSettings">บันทึกการตั้งค่า</button></div></div>
  ${mode === 'cloud' ? `<div class="panel" style="margin-top:14px"><h3>บัญชีผู้ใช้</h3><div class="row" style="justify-content:space-between"><span>เข้าสู่ระบบด้วย <b>${esc(userEmail)}</b></span><button class="btn" data-act="signOut">ออกจากระบบ</button></div>
    <form class="f" id="pwF" style="margin-top:14px" onsubmit="return false"><input type="email" autocomplete="username" value="${esc(userEmail)}" hidden>
      <div class="fld"><label for="pw-new">ตั้งรหัสผ่านใหม่</label><input id="pw-new" type="password" autocomplete="new-password" minlength="6"></div>
      <div class="fld"><label for="pw-again">พิมพ์รหัสผ่านอีกครั้ง</label><input id="pw-again" type="password" autocomplete="new-password" minlength="6"></div>
    </form><div class="actions" style="margin-top:10px"><button class="btn" data-act="changePassword">บันทึกรหัสผ่าน</button></div></div>` : ''}
  <div class="panel" style="margin-top:14px"><h3>ข้อมูลในระบบ</h3>
    <p class="small muted" style="margin-top:0">ห้อง ${Object.keys(S.rooms).length} · ผู้เช่า ${Object.keys(S.tenants).length} · การจดมิเตอร์ ${Object.keys(S.readings).length} · บิล ${Object.keys(S.bills).length} · งานซ่อม ${Object.keys(S.repairs).length}</p>
    <div class="row"><button class="btn primary" data-act="exportExcel">ส่งออกเป็น Excel</button><button class="btn" data-act="downloadBackup">ดาวน์โหลดไฟล์สำรอง</button><label class="btn" for="restoreFile">นำเข้าไฟล์สำรอง</label><input type="file" id="restoreFile" accept=".json,application/json" hidden><button class="btn" data-act="copyBackup">คัดลอกข้อมูลสำรอง (JSON)</button></div><p class="small muted">ไฟล์ Excel และไฟล์สำรองมีข้อมูลผู้เช่า เก็บไว้ในเครื่องตัวเอง อย่าอัปโหลดขึ้น GitHub</p><div>${st.sample ? '<button class="btn danger" data-act="clearSample" data-confirm="1">ล้างข้อมูลตัวอย่าง</button>' : ''}</div>
  </div>`;
}
async function saveSettings() {
  const d = Object.fromEntries(new FormData($('#setF')));
  const data = {...(S.settings.main || {}), dormName: d.dormName.trim() || DEFAULTS.dormName, waterRate: +d.waterRate || 0, waterMin: +d.waterMin || 0, elecRate: +d.elecRate || 0,
    commonFee: +d.commonFee || 0, internetFee: +d.internetFee || 0, defaultRent: +d.defaultRent || 0,
    fridgeFee: +d.fridgeFee || 0, hotWaterFee: +d.hotWaterFee || 0, wifiFee: +d.wifiFee || 0, ratesV2: true, dueDay: Math.min(28, Math.max(1, +d.dueDay || 5)), promptpay: d.promptpay.trim()};
  if (await put('settings', 'main', data)) toast('บันทึกการตั้งค่าแล้ว ใช้กับบิลที่ออกใหม่');
}
async function clearSample() {
  let n = 0;
  for (const col of ['bills', 'readings', 'repairs', 'tenants', 'rooms']) for (const [id, v] of Object.entries(S[col])) if (v.sample) { await remove(col, id); n++; }
  await put('settings', 'main', {...(S.settings.main || {}), sample: false});
  toast(`ล้างข้อมูลตัวอย่าง ${n} รายการแล้ว เริ่มเพิ่มห้องจริงได้เลย`);
  ui.view = 'rooms'; render();
}

/* ---------- modal / toast ---------- */
let lastFocus = null;
function modal(html, mount) { lastFocus = document.activeElement; const box = $('#modalBox'); box.innerHTML = html; $('#modal').hidden = false; mount && mount(box); const f = box.querySelector('input:not([type=hidden]),select,textarea,button.primary'); f && f.focus(); }
function closeModal() { $('#modal').hidden = true; $('#modalBox').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 3200); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); } catch (e) { toast('คัดลอกอัตโนมัติไม่ได้ เลือกข้อความแล้วคัดลอกเองได้'); } }

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  if (ev.target === $('#modal')) { closeModal(); return; }
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.type === 'submit') ev.preventDefault();
  if (el.dataset.confirm && !el.dataset.armed) { el.dataset.armed = '1'; el.dataset.orig = el.textContent; el.textContent = 'กดอีกครั้งเพื่อยืนยัน'; setTimeout(() => { if (document.contains(el)) { delete el.dataset.armed; el.textContent = el.dataset.orig; } }, 3500); return; }
  const {act, id} = el.dataset;
  switch (act) {
    case 'go': ui.view = el.dataset.v; try { history.replaceState(null, '', '#' + ui.view); } catch (e) {} closeModal(); render(); window.scrollTo(0, 0); break;
    case 'month': ui.month = el.dataset.to || addMonths(ui.month, +el.dataset.k); render(); break;
    case 'close': closeModal(); break;
    case 'roomForm': roomForm(id); break;
    case 'roomSave': roomSave(id); break;
    case 'roomDelete': closeModal(); if (await remove('rooms', id)) {
      for (const [rid, rd] of Object.entries(S.readings)) if (rd.roomId === id && !S.bills[rid]) await remove('readings', rid);
      toast('ลบห้องแล้ว'); if (ui.view === 'room') { ui.view = 'rooms'; render(); } } break;
    case 'readingDelete': if (await remove('readings', id)) toast('ลบเลขมิเตอร์แล้ว'); break;
    case 'roomInfo': case 'room': openRoom(id); break;
    case 'bulkForm': bulkForm(); break;
    case 'bulkSave': el.disabled = true; await bulkSave(); break;
    case 'tFilter': ui.tenantFilter = el.dataset.f; render(); break;
    case 'tenantForm': tenantForm(id, el.dataset.room); break;
    case 'tenantSave': tenantSave(id); break;
    case 'tenantDelete': closeModal(); if (await remove('tenants', id)) toast('ลบประวัติผู้เช่าแล้ว'); break;
    case 'moveOut': moveOutForm(id); break;
    case 'moveOutSave': moveOutSave(id); break;
    case 'genBills': el.disabled = true; await genBills(); break;
    case 'bFilter': ui.billFilter = el.dataset.f; render(); break;
    case 'bOpen': ui.billOpen = ui.billOpen === id ? '' : id; render(); break;
    case 'bill': billModal(id); break;
    case 'pay': payForm(id); break;
    case 'paySave': paySave(id); break;
    case 'unpay': { const b = {...S.bills[id]}; ['paidAt', 'method', 'payNote', 'paidAmount', 'receiptNo'].forEach(k => delete b[k]); b.status = 'unpaid'; await put('bills', id, b); billModal(id); break; }
    case 'billDelete': closeModal(); if (await remove('bills', id)) toast('ลบบิลแล้ว แก้เลขมิเตอร์แล้วออกบิลใหม่ได้'); break;
    case 'itemAdd': { const l = $('#it-l').value.trim(), a = +$('#it-a').value; if (!l || !a) { toast('ใส่ชื่อรายการและจำนวนเงิน'); return; } const b = {...S.bills[id], items: [...S.bills[id].items, {label: l, amount: a}]}; b.total = billTotal(b); await put('bills', id, b); billModal(id); break; }
    case 'itemDel': { const items = S.bills[id].items.filter((_, k) => k !== +el.dataset.k); const b = {...S.bills[id], items}; b.total = billTotal(b); await put('bills', id, b); billModal(id); break; }
    case 'copyBill': copy($('#billTxt').textContent); break;
    case 'repairForm': repairForm(id, el.dataset.room); break;
    case 'repairSave': repairSave(id); break;
    case 'repairStep': await put('repairs', id, {...S.repairs[id], status: el.dataset.to}); break;
    case 'repairDone': repairDoneForm(id); break;
    case 'repairDoneSave': { const d = Object.fromEntries(new FormData($('#rdF'))); closeModal(); await put('repairs', id, {...S.repairs[id], status: 'done', doneAt: d.doneAt || todayStr(), cost: +d.cost || 0}); toast('ปิดงานซ่อมแล้ว'); break; }
    case 'repairDelete': closeModal(); await remove('repairs', id); break;
    case 'saveSettings': saveSettings(); break;
    case 'copyBackup': copy(JSON.stringify(S, null, 1)); break;
    case 'downloadBackup': { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'})); a.download = 'dorm-backup-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove(); break; }
    case 'clearSample': closeModal(); clearSample(); break;
    case 'exportExcel': el.disabled = true; await exportExcel(); el.disabled = false; break;
    case 'loginEmail': el.disabled = true; await loginEmail(); el.disabled = false; break;
    case 'loginPassword': ev.preventDefault(); el.disabled = true; await loginPassword(); if (document.contains(el)) el.disabled = false; break;
    case 'changePassword': el.disabled = true; await changePassword(); el.disabled = false; break;
    case 'loginGoogle': await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: redirectUrl()}}); break;
    case 'loginBack': loginSent = ''; render(); break;
    case 'signOut': await sb.auth.signOut(); break;
    case 'reload': location.reload(); break;
  }
});
document.addEventListener('change', ev => { const tr = ev.target.closest && ev.target.closest('tr[data-room]'); if (tr && ev.target.dataset.meter) saveMeterRow(tr); });
document.addEventListener('change', ev => {
  if (ev.target.id !== 'restoreFile' || !ev.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let o; try { o = JSON.parse(fr.result); if (!o || typeof o.rooms !== 'object') throw 0; } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบหอพัก'); return; }
    if (mode === 'cloud') {
      const rows = []; COLS.forEach(c => Object.entries(o[c] || {}).forEach(([id, data]) => rows.push({col: c, id, data})));
      toast('กำลังนำเข้า ' + rows.length + ' รายการ');
      try { await putMany(rows); await loadAll(); render(); toast('นำเข้าข้อมูลสำรองแล้ว'); } catch (e) { toast(cloudErr(e)); }
    } else { COLS.forEach(c => S[c] = o[c] || {}); saveLocal(); render(); toast('นำเข้าข้อมูลสำรองแล้ว'); }
    ev.target.value = '';
  };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'loginF') loginPassword(); });

/* ---------- login ---------- */
let loginSent = '';
function viewLogin() {
  const st = settings();
  if (loginSent) return `<div class="login"><div class="panel"><h2>เช็กอีเมลของคุณ</h2>
    <p style="margin:0">ส่งลิงก์เข้าสู่ระบบไปที่ <b>${esc(loginSent)}</b> แล้ว เปิดอีเมลแล้วกดลิงก์ "Log In" ระบบจะพากลับมาที่หน้านี้เอง</p>
    <p class="small muted" style="margin:0">ไม่เจออีเมล ลองดูในโฟลเดอร์จดหมายขยะ (Spam) หรือรอสักครู่</p>
    <button class="btn" data-act="loginBack">ใช้อีเมลอื่น</button></div></div>`;
  return `<div class="login"><div><h2>${esc(st.dormName)}</h2><p class="muted" style="margin:4px 0 0">เข้าสู่ระบบเพื่อดูและบันทึกข้อมูลหอพัก</p></div>
  <div class="panel">
    ${CFG.googleLogin ? `<button class="btn primary big" data-act="loginGoogle">เข้าสู่ระบบด้วย Google</button><div class="or">หรือ</div>` : ''}
    <form id="loginF" style="display:flex;flex-direction:column;gap:10px">
      <div class="fld"><label for="lg-email">อีเมล</label><input id="lg-email" name="email" type="email" required autocomplete="username" inputmode="email" placeholder="name@gmail.com" value="${esc(lastEmail())}"></div>
      <div class="fld"><label for="lg-pass">รหัสผ่าน</label><input id="lg-pass" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn ${CFG.googleLogin ? '' : 'primary'} big" data-act="loginPassword" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="small muted" style="margin:0">เข้าสู่ระบบครั้งเดียว เครื่องนี้จะจำไว้ ครั้งต่อไปเปิดมาใช้ได้เลย</p>
    <button class="linkbtn small" data-act="loginEmail" type="button">ยังไม่มีรหัสหรือลืมรหัส? ส่งลิงก์เข้าสู่ระบบทางอีเมลแทน</button>
  </div></div>`;
}
function viewDenied() {
  return `<div class="login"><div class="panel"><h2>บัญชีนี้ยังไม่ได้รับอนุญาต</h2>
  <p style="margin:0">คุณเข้าสู่ระบบด้วย <b>${esc(userEmail)}</b> แต่อีเมลนี้ยังไม่อยู่ในรายชื่อผู้ใช้ของหอพัก ส่งอีเมลนี้ให้ผู้ดูแลเพื่อเพิ่มสิทธิ์</p>
  <button class="btn big" data-act="signOut">ออกจากระบบ แล้วใช้อีเมลอื่น</button></div></div>`;
}
const redirectUrl = () => location.origin + location.pathname;
const lastEmail = () => { try { return localStorage.getItem('dorm-last-email') || ''; } catch (e) { return ''; } };
const rememberEmail = e => { try { localStorage.setItem('dorm-last-email', e); } catch (x) {} };
async function loginPassword() {
  const f = $('#loginF'); if (!f.reportValidity()) return;
  const email = $('#lg-email').value.trim(), password = $('#lg-pass').value;
  const {error} = await sb.auth.signInWithPassword({email, password});
  if (error) { toast(/invalid|credentials/i.test(error.message) ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : /rate|seconds|many/i.test(error.message) ? 'ลองถี่เกินไป รอสักครู่แล้วลองใหม่' : 'เข้าสู่ระบบไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองใหม่'); return; }
  rememberEmail(email);
}
async function changePassword() {
  const a = $('#pw-new').value, b = $('#pw-again').value;
  if (a.length < 6) { toast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัว'); return; }
  if (a !== b) { toast('รหัสผ่านสองช่องไม่ตรงกัน'); return; }
  const {error} = await sb.auth.updateUser({password: a});
  if (error) { toast(/reauth|nonce/i.test(error.message) ? 'ต้องออกจากระบบแล้วเข้าใหม่ก่อน จึงจะเปลี่ยนรหัสได้' : 'เปลี่ยนรหัสไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  $('#pw-new').value = $('#pw-again').value = ''; toast('ตั้งรหัสผ่านแล้ว ครั้งหน้าเข้าสู่ระบบด้วยรหัสนี้ได้เลย');
}
async function loginEmail() {
  const em = $('#lg-email'); if (!em.reportValidity()) return;
  const email = em.value.trim(); rememberEmail(email);
  const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: redirectUrl()}});
  if (error) { toast(/rate|seconds/i.test(error.message) ? 'ส่งถี่เกินไป รอประมาณ 1 นาทีแล้วลองใหม่' : 'ส่งลิงก์ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  loginSent = email; render();
}
async function startSession(session) {
  userEmail = session.user.email || '';
  mode = 'loading'; render();
  const {data, error} = await sb.from('allowed_users').select('email').limit(1);
  if (error) { mode = 'error'; render(); return; }
  if (!data.length) { mode = 'denied'; render(); return; }
  try { await loadAll(); } catch (e) { mode = 'error'; render(); return; }
  mode = 'cloud'; subscribeCloud(); render();
  autoSetupRooms();
}

/* ---------- excel ---------- */
function loadScript(src) { return new Promise((ok, bad) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = bad; document.head.appendChild(t); }); }
async function exportExcel() {
  try { if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
  catch (e) { toast('โหลดตัวสร้างไฟล์ Excel ไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่'); return; }
  const rn = id => roomById(id)?.no || '';
  const stName = {occ: 'มีผู้เช่า', vacant: 'ว่าง', fix: 'ปิดซ่อม'};
  const sheets = {
    'ห้องพัก': rooms().map(r => ({'ห้อง': r.no, 'ชั้น': r.floor, 'ประเภท': r.type, 'ค่าเช่า': +r.rent || 0, 'ส่วนเสริม': addonText(r), 'รวม/เดือน': roomMonthly(r), 'สถานะ': stName[roomState(r)], 'ผู้เช่า': tenantOf(r.id)?.name || ''})),
    'ผู้เช่า': withId('tenants').map(t => ({'ชื่อ': t.name, 'ห้อง': rn(t.roomId), 'เบอร์โทร': t.phone, 'เลขบัตรประชาชน': t.idCard, 'ผู้ติดต่อฉุกเฉิน': [t.emergencyName, t.emergencyPhone].filter(Boolean).join(' '), 'วันเข้าพัก': t.moveIn, 'สิ้นสุดสัญญา': t.contractEnd, 'เงินประกัน': +t.deposit || 0, 'สถานะ': t.status === 'active' ? 'พักอยู่' : 'ย้ายออกแล้ว', 'วันย้ายออก': t.moveOut || '', 'คืนประกัน': t.refund ?? ''})),
    'บิล': withId('bills').sort((a, b) => (a.month + a.roomNo).localeCompare(b.month + b.roomNo, 'th', {numeric: true})).map(b => ({'เดือน': b.month, 'เลขที่บิล': b.no, 'ห้อง': b.roomNo, 'ผู้เช่า': b.tenantName, 'น้ำ (หน่วย)': b.waterUnits, 'ไฟ (หน่วย)': b.elecUnits, 'ยอดรวม': billTotal(b), 'ครบกำหนด': b.dueDate, 'สถานะ': BILL_PILL[billState(b)][1], 'วันที่จ่าย': b.paidAt || '', 'ช่องทาง': b.method || '', 'ใบเสร็จ': b.receiptNo || ''})),
    'มิเตอร์': Object.values(S.readings).sort((a, b) => (a.month + rn(a.roomId)).localeCompare(b.month + rn(b.roomId), 'th', {numeric: true})).map(r => ({'เดือน': r.month, 'ห้อง': rn(r.roomId), 'มิเตอร์น้ำ': r.water, 'มิเตอร์ไฟ': r.elec, 'วันที่จด': r.readAt})),
    'แจ้งซ่อม': withId('repairs').map(r => ({'วันที่แจ้ง': r.reportedAt, 'ห้อง': rn(r.roomId) || 'ส่วนกลาง', 'ปัญหา': r.title, 'รายละเอียด': r.detail, 'สถานะ': {new: 'รอดำเนินการ', doing: 'กำลังซ่อม', done: 'เสร็จแล้ว'}[r.status], 'วันที่เสร็จ': r.doneAt || '', 'ค่าใช้จ่าย': r.cost || ''}))
  };
  const wb = XLSX.utils.book_new();
  for (const [name, rows] of Object.entries(sheets)) { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]); XLSX.utils.book_append_sheet(wb, ws, name); }
  XLSX.writeFile(wb, 'dorm-' + todayStr() + '.xlsx');
}

const VIEW_FN = {room: viewRoom, dashboard: viewDashboard, rooms: viewRooms, tenants: viewTenants, meters: viewMeters, bills: viewBills, repairs: viewRepairs, settings: viewSettings};

/* ---------- boot ---------- */
async function boot() {
  render();
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { mode = 'local'; loadLocal(); render(); autoSetupRooms(); return; }
  if (!window.supabase) { mode = 'error'; render(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (session && !started) { started = true; setTimeout(() => startSession(session)); }
    else if (!session) {
      started = false; userEmail = ''; if (channel) { sb.removeChannel(channel); channel = null; }
      COLS.forEach(c => S[c] = {}); mode = 'login'; render();
    }
  });
  const {data} = await sb.auth.getSession();
  if (!data.session && mode === 'loading') { mode = 'login'; render(); }
}
boot();
})();
</script>
