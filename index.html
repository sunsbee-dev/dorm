<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบจัดการหอพัก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ledger-like work surface, side nav on desktop, scrolling tab strip on phone; room numbers shown as key tags */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface-2:#f5f8f6; --ink:#15211d; --muted:#5a6b65; --line:#d5dfdb;
  --accent:#0e6b57; --accent-ink:#ffffff; --accent-soft:#dbeee7;
  --ok:#1b7443; --ok-soft:#ddf1e5; --warn:#9a5800; --warn-soft:#fbecd3; --bad:#b3261e; --bad-soft:#fde3df;
  --idle:#7f8d88; --idle-soft:#e6ebe9; --fix:#5948b0; --fix-soft:#e9e6fa;
  --water:#2a72b8; --elec:#c98a00;
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#151f1c; --surface-2:#1b2723; --ink:#e3ece8; --muted:#97aaa3; --line:#283632;
  --accent:#4cc39f; --accent-ink:#06231b; --accent-soft:#163a30;
  --ok:#5bcf8a; --ok-soft:#153222; --warn:#f0b14a; --warn-soft:#382811; --bad:#ff8b7c; --bad-soft:#3b1a16;
  --idle:#7c8b86; --idle-soft:#212b28; --fix:#ab9eff; --fix-soft:#262149;
  --water:#6fb1ef; --elec:#f2c046; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#151f1c; --surface-2:#1b2723; --ink:#e3ece8; --muted:#97aaa3; --line:#283632;
  --accent:#4cc39f; --accent-ink:#06231b; --accent-soft:#163a30;
  --ok:#5bcf8a; --ok-soft:#153222; --warn:#f0b14a; --warn-soft:#382811; --bad:#ff8b7c; --bad-soft:#3b1a16;
  --idle:#7c8b86; --idle-soft:#212b28; --fix:#ab9eff; --fix-soft:#262149;
  --water:#6fb1ef; --elec:#f2c046; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.25rem;font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{min-width:0;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.brand .sub{font-size:.78rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;font-family:var(--f-mono)}
.side-foot{display:none}
main{padding-block:18px 48px;padding-inline:16px;min-width:0;max-width:1180px;width:100%}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .side{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:20px 18px 12px}
  nav.tabs{flex-direction:column;overflow:visible;padding:8px 12px}
  .tab{padding:10px 12px}
  .side-foot{display:block;margin-top:auto;padding:16px 18px;font-size:.78rem;color:var(--muted)}
  main{padding-inline:32px;padding-block:26px 64px}
}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.monthpick button{border:0;background:none;width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.monthpick button:hover{background:var(--surface-2);color:var(--ink)}
.monthpick span{min-width:128px;text-align:center;font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:.9rem}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.stat{background:var(--surface);padding:14px 16px}
.stat .k{font-size:.8rem;color:var(--muted);letter-spacing:.01em}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.55rem;font-weight:600;line-height:1.2;margin-top:2px}
.stat .s{font-size:.8rem;color:var(--muted)}
.stat.bad .v{color:var(--bad)}
.meter{height:6px;border-radius:9px;background:var(--idle-soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.tag{font-family:var(--f-mono);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;padding:1px 8px 1px 6px;border:1px solid var(--line);background:var(--surface-2);border-radius:5px 12px 12px 5px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--muted)}
.p-fix{background:var(--fix-soft);color:var(--fix)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .grow b{font-weight:500}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.78rem;color:var(--muted);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);text-align:right}
td input:disabled{background:var(--surface-2);color:var(--muted)}
.warnText{color:var(--warn);font-size:.8rem}
.floors{display:flex;flex-direction:column;gap:10px}
.floor{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.floor .fl{font-size:.8rem;color:var(--muted);padding-top:12px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.cell{border:1px solid transparent;border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-family:var(--f-mono);font-weight:600;line-height:1.2}
.cell small{display:block;font-family:var(--f-body);font-weight:500;font-size:.7rem;margin-top:2px}
.cell:hover{border-color:var(--ink)}
.c-paid{background:var(--ok-soft);color:var(--ok)} .c-unpaid{background:var(--warn-soft);color:var(--warn)}
.c-overdue{background:var(--bad-soft);color:var(--bad)} .c-nobill{background:var(--accent-soft);color:var(--accent)}
.c-vacant{background:var(--idle-soft);color:var(--muted)} .c-fix{background:var(--fix-soft);color:var(--fix)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid line{stroke:var(--line)}
.keys{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col > h3{display:flex;justify-content:space-between}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.82rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.fld .hint{font-size:.75rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(10,18,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.modal .box{background:var(--surface);border-radius:14px;width:100%;max-width:620px;padding:20px;margin-top:4vh;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.modal .box > header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.2rem;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.bill-items td:last-child{text-align:right}
.bill-total{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem;padding-top:6px}
pre.copy{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-body);font-size:.88rem;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
.loading{padding:40px 0;color:var(--muted)}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{display:flex;flex-direction:column;gap:12px;padding:22px}
.login .big{width:100%;justify-content:center;min-height:46px;font-size:1rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.app.locked .side nav,.app.locked .side-foot{display:none!important}
@media (prefers-reduced-motion:no-preference){.modal .box{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>

<body>


<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">ห</div><div><h1 id="dormName">หอพัก</h1><div class="sub" id="modeText">กำลังเชื่อมต่อข้อมูล</div></div></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="view"><div class="loading">กำลังโหลด</div></main>
</div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const round2 = n => Math.round((+n || 0) * 100) / 100;
const baht = n => round2(n).toLocaleString('th-TH', {maximumFractionDigits: 2});
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const thisMonth = () => todayStr().slice(0, 7);
const addMonths = (m, k) => { let [y, mo] = m.split('-').map(Number); mo += k; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return y + '-' + p2(mo); };
const monthLabel = (m, short) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('th-TH', short ? {month: 'short', year: '2-digit'} : {month: 'long', year: 'numeric'}); };
const dateLabel = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH', {day: 'numeric', month: 'short', year: '2-digit'}) : '-';
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const addDays = (d, k) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + k); return x.getFullYear() + '-' + p2(x.getMonth() + 1) + '-' + p2(x.getDate()); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- data ---------- */
const COLS = ['rooms', 'tenants', 'readings', 'bills', 'repairs', 'settings'];
const S = {}; COLS.forEach(c => S[c] = {});
const DEFAULTS = {dormName: 'หอพักของฉัน', waterRate: 18, waterMin: 0, elecRate: 8, commonFee: 0, internetFee: 0, dueDay: 5, promptpay: '', sample: false};
const settings = () => ({...DEFAULTS, ...(S.settings.main || {})});
let mode = 'loading', sb = null, userEmail = '', readOnly = false;
const CFG = window.DORM_CONFIG || {};
const LS_KEY = 'dorm-manager-v1';

const VIEWS = [
  ['dashboard', 'ภาพรวม'], ['rooms', 'ห้องพัก'], ['tenants', 'ผู้เช่าและสัญญา'], ['meters', 'จดมิเตอร์'],
  ['bills', 'บิลและการชำระ'], ['repairs', 'แจ้งซ่อม'], ['settings', 'ตั้งค่า']
];
const hashView = (location.hash || '').slice(1);
const ui = {view: VIEWS.some(v => v[0] === hashView) ? hashView : 'dashboard', month: thisMonth(), billFilter: 'all', tenantFilter: 'active'};

function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); COLS.forEach(c => S[c] = o[c] || {}); } } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
function cloudErr(e) {
  const m = String((e && (e.message || e.code)) || '');
  if (/row-level security|permission|42501/i.test(m)) return 'บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูล';
  if (/JWT|expired|401/i.test(m)) return 'หมดเวลาการเข้าสู่ระบบ ลองโหลดหน้านี้ใหม่';
  if (/Failed to fetch|network/i.test(m)) return 'บันทึกไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองใหม่';
  return 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
}
async function put(col, id, data) {
  if (readOnly) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return false; }
  const before = S[col][id];
  S[col] = {...S[col], [id]: data}; scheduleRender();
  if (mode === 'cloud') {
    const {error} = await sb.from('docs').upsert({col, id, data, updated_at: new Date().toISOString()});
    if (error) { const o = {...S[col]}; if (before) o[id] = before; else delete o[id]; S[col] = o; scheduleRender(); toast(cloudErr(error)); return false; }
  } else saveLocal();
  return true;
}
async function remove(col, id) {
  if (readOnly) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return false; }
  const before = S[col][id];
  const o = {...S[col]}; delete o[id]; S[col] = o; scheduleRender();
  if (mode === 'cloud') {
    const {error} = await sb.from('docs').delete().match({col, id});
    if (error) { S[col] = {...S[col], [id]: before}; scheduleRender(); toast(cloudErr(error)); return false; }
  } else saveLocal();
  return true;
}
async function loadAll() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const {data, error} = await sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) break;
  }
  const fresh = {}; COLS.forEach(c => fresh[c] = {});
  rows.forEach(r => { if (fresh[r.col]) fresh[r.col][r.id] = r.data; });
  COLS.forEach(c => S[c] = fresh[c]);
}
async function putMany(rows) {
  for (let i = 0; i < rows.length; i += 400) {
    const {error} = await sb.from('docs').upsert(rows.slice(i, i + 400).map(r => ({...r, updated_at: new Date().toISOString()})));
    if (error) throw error;
  }
}
let channel = null;
function subscribeCloud() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('docs-live').on('postgres_changes', {event: '*', schema: 'public', table: 'docs'}, p => {
    if (p.eventType === 'DELETE') { const r = p.old || {}; if (S[r.col] && r.id in S[r.col]) { const o = {...S[r.col]}; delete o[r.id]; S[r.col] = o; } }
    else { const r = p.new || {}; if (S[r.col]) S[r.col] = {...S[r.col], [r.id]: r.data}; }
    scheduleRender();
  }).subscribe();
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && mode === 'cloud') { try { await loadAll(); scheduleRender(); } catch (e) {} }
});

/* ---------- derived ---------- */
const withId = col => Object.entries(S[col]).map(([id, v]) => ({id, ...v}));
const rooms = () => withId('rooms').sort((a, b) => String(a.no).localeCompare(String(b.no), 'th', {numeric: true}));
const roomById = id => S.rooms[id] ? {id, ...S.rooms[id]} : null;
const tenantOf = roomId => withId('tenants').find(t => t.roomId === roomId && t.status === 'active') || null;
const roomState = r => r.maintenance ? 'fix' : (tenantOf(r.id) ? 'occ' : 'vacant');
const readingOf = (roomId, m) => S.readings[roomId + '_' + m];
function prevReading(room, m) {
  let best = null;
  for (const rd of Object.values(S.readings)) if (rd.roomId === room.id && rd.month < m && (!best || rd.month > best.month)) best = rd;
  return best ? {water: +best.water, elec: +best.elec, month: best.month} : {water: +room.startWater || 0, elec: +room.startElec || 0, month: null};
}
function usage(room, m) {
  const cur = readingOf(room.id, m); if (!cur) return null;
  const p = prevReading(room, m);
  return {w: round2(cur.water - p.water), e: round2(cur.elec - p.elec), prev: p, cur};
}
const billOf = (roomId, m) => { const b = S.bills[roomId + '_' + m]; return b ? {id: roomId + '_' + m, ...b} : null; };
const billTotal = b => round2((b.items || []).reduce((s, i) => s + (+i.amount || 0), 0));
const billState = b => b.status === 'paid' ? 'paid' : (todayStr() > b.dueDate ? 'overdue' : 'unpaid');
const BILL_PILL = {paid: ['p-ok', 'จ่ายแล้ว'], unpaid: ['p-warn', 'รอชำระ'], overdue: ['p-bad', 'เลยกำหนด']};
const billPill = b => { const [c, t] = BILL_PILL[billState(b)]; return `<span class="pill ${c}">${t}</span>`; };
const tag = no => `<span class="tag">${esc(no)}</span>`;

/* ---------- render core ---------- */
let rq = false, pending = false;
const isEditing = () => { const a = document.activeElement; return a && a.closest && a.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); };
function scheduleRender() {
  if (rq) return; rq = true;
  requestAnimationFrame(() => { rq = false; if (isEditing()) { pending = true; return; } render(); });
}
document.addEventListener('focusout', () => { if (pending) setTimeout(() => { if (pending && !isEditing()) { pending = false; render(); } }, 80); });

const monthPicker = () => `<div class="monthpick"><button data-act="month" data-k="-1" aria-label="เดือนก่อน">‹</button><span>${monthLabel(ui.month)}</span><button data-act="month" data-k="1" aria-label="เดือนถัดไป">›</button></div>`;

  const mb = withId('bills').filter(b => b.month === m);
  const billed = mb.reduce((s, b) => s + billTotal(b), 0), got = mb.filter(b => b.status === 'paid').reduce((s, b) => s + billTotal(b), 0);

    <div class="panel"><p>ยังไม่มีห้องพักในระบบ</p><div class="row"><button class="btn primary" data-act="roomForm">เพิ่มห้องแรก</button><button class="btn" data-act="go" data-v="settings">ตั้งค่าเรทน้ำไฟ</button></div></div>`;

  <div class="head"><div><h2>ภาพรวม</h2><p>สรุปของเดือน${monthLabel(m)}</p></div>${monthPicker()}</div>
  <div class="stats">
    <div class="stat"><div class="k">ห้องทั้งหมด</div><div class="v">${rs.length}</div><div class="s">ว่าง ${vac} · ปิดซ่อม ${fix}</div></div>
    <div class="stat"><div class="k">มีผู้เช่า</div><div class="v">${occ}</div><div class="s">อัตราเข้าพัก ${rate}%</div><div class="meter"><i style="width:${rate}%"></i></div></div>
    <div class="stat"><div class="k">เก็บได้เดือนนี้ (บาท)</div><div class="v">${baht(got)}</div><div class="s">จากที่ออกบิล ${baht(billed)}</div><div class="meter"><i style="width:${billed ? Math.round(got / billed * 100) : 0}%"></i></div></div>
    <div class="stat ${owed ? 'bad' : ''}"><div class="k">ค้างชำระรวม (บาท)</div><div class="v">${baht(owed)}</div><div class="s">${unpaid.length} บิล ทุกเดือน</div></div>
  </div>
  <div class="grid g2">
    <div class="panel"><h3>บิลที่ยังไม่จ่าย <button class="btn sm" data-act="go" data-v="bills">ดูทั้งหมด</button></h3><div class="list">
      ${unpaid.length ? unpaid.slice(0, 6).map(b => li(tag(b.roomNo), `<b>${esc(b.tenantName)}</b> <span class="muted small">· ${monthLabel(b.month, true)} · ครบกำหนด ${dateLabel(b.dueDate)}</span>`, `<span class="num">${baht(billTotal(b))}</span> ${billPill(b)}`, `data-act="bill" data-id="${b.id}" style="cursor:pointer"`)).join('') + more(unpaid, 6) : '<div class="empty">ไม่มีบิลค้าง ทุกห้องจ่ายครบแล้ว</div>'}
    </div></div>

      ${repairs.length ? repairs.slice(0, 6).map(r => li(tag(roomById(r.roomId)?.no || '-'), `<b>${esc(r.title)}</b> <span class="muted small">· แจ้ง ${dateLabel(r.reportedAt)}</span>`, r.status === 'doing' ? '<span class="pill p-fix">กำลังซ่อม</span>' : '<span class="pill p-warn">รอดำเนินการ</span>')).join('') + more(repairs, 6) : '<div class="empty">ไม่มีงานซ่อมค้าง</div>'}

      ${ending.length || moving.length ? [...ending.map(t => { const d = daysBetween(today, t.contractEnd); return li(tag(roomById(t.roomId)?.no || '-'), `<b>${esc(t.name)}</b> <span class="muted small">· หมด ${dateLabel(t.contractEnd)}</span>`, d < 0 ? '<span class="pill p-bad">หมดสัญญาแล้ว</span>' : `<span class="pill p-warn">อีก ${d} วัน</span>`, `data-act="tenantForm" data-id="${t.id}" style="cursor:pointer"`); }),
        ...moving.filter(t => !ending.includes(t)).map(t => li(tag(roomById(t.roomId)?.no || '-'), `<b>${esc(t.name)}</b> <span class="muted small">· จะย้ายออก ${dateLabel(t.moveOutPlanned)}</span>`, '<span class="pill p-idle">แจ้งย้ายออก</span>', `data-act="tenantForm" data-id="${t.id}" style="cursor:pointer"`))].join('') : '<div class="empty">ไม่มีสัญญาที่จะหมดใน 30 วัน</div>'}

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function fmtAxis(v) { return v >= 1000 ? (v / 1000).toLocaleString('th-TH', {maximumFractionDigits: 1}) + 'k' : String(Math.round(v)); }
function barChart(data, colors, dual) {
  const W = 560, H = 210, L = 44, R = dual ? 44 : 8, T = 12, B = 28, iw = W - L - R, ih = H - T - B;
  const maxes = dual ? [niceMax(Math.max(...data.map(d => d.v[0]))), niceMax(Math.max(...data.map(d => d.v[1])))] : [niceMax(Math.max(...data.flatMap(d => d.v)))];
  const gw = iw / data.length, bw = Math.min(26, gw * 0.32);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><g class="grid">`;
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - ih * i / 4;
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    s += `<text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtAxis(maxes[0] * i / 4)}</text>`;
    if (dual) s += `<text x="${W - R + 6}" y="${y + 4}">${fmtAxis(maxes[1] * i / 4)}</text>`;
  }
  s += '</g>';
  data.forEach((d, gi) => {
    const cx = L + gw * gi + gw / 2;
    d.v.forEach((v, si) => {
      const mx = dual ? maxes[si] : maxes[0], h = Math.max(0, ih * v / mx), x = cx - bw - 2 + si * (bw + 4);
      s += `<rect x="${x}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${colors[si]}"><title>${esc(d.label)}: ${baht(v)}</title></rect>`;
    });
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return s + '</svg>';
}
function roomMap(m) {
  const floors = {};
  rooms().forEach(r => { const f = r.floor || '-'; (floors[f] = floors[f] || []).push(r); });
  const keys = Object.keys(floors).sort((a, b) => String(a).localeCompare(String(b), 'th', {numeric: true}));
  const cells = keys.map(f => `<div class="floor"><div class="fl">ชั้น ${esc(f)}</div><div class="rooms">${floors[f].map(r => {
    const st = roomState(r); let c = 'vacant', t = 'ว่าง';
    if (st === 'fix') { c = 'fix'; t = 'ปิดซ่อม'; }
    else if (st === 'occ') { const b = billOf(r.id, m); if (!b) { c = 'nobill'; t = 'ยังไม่ออกบิล'; } else { c = billState(b); t = BILL_PILL[c][1]; } }
    return `<button class="cell c-${c}" data-act="roomInfo" data-id="${r.id}">${esc(r.no)}<small>${t}</small></button>`;
  }).join('')}</div></div>`).join('');
  return `<div class="floors">${cells}</div><div class="legend"><span><i class="c-paid"></i>จ่ายแล้ว</span><span><i class="c-unpaid"></i>รอชำระ</span><span><i class="c-overdue"></i>เลยกำหนด</span><span><i class="c-nobill"></i>ยังไม่ออกบิล</span><span><i class="c-vacant"></i>ว่าง</span><span><i class="c-fix"></i>ปิดซ่อม</span></div>`;
}

async function roomSave(id) {
  const f = $('#roomF'); if (!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f));
  const no = d.no.trim();
  if (rooms().some(r => r.no === no && r.id !== id)) { toast('มีห้อง ' + no + ' อยู่แล้ว'); return; }
  const old = id ? S.rooms[id] : {};
  const data = {...old, no, floor: d.floor.trim() || no.charAt(0), type: d.type.trim(), rent: +d.rent || 0, startWater: +d.startWater || 0, startElec: +d.startElec || 0, maintenance: !!d.maintenance, note: d.note.trim()};
  closeModal(); if (await put('rooms', id || 'r' + uid(), data)) toast('บันทึกห้อง ' + no + ' แล้ว');
}

/* ---------- tenants ---------- */
function viewTenants() {
  const all = withId('tenants'), f = ui.tenantFilter, today = todayStr();
  const list = all.filter(t => f === 'active' ? t.status === 'active' : t.status !== 'active')
    .sort((a, b) => String(roomById(a.roomId)?.no || '').localeCompare(String(roomById(b.roomId)?.no || ''), 'th', {numeric: true}));
  return `<div class="head"><div><h2>ผู้เช่าและสัญญา</h2><p>${all.filter(t => t.status === 'active').length} คนพักอยู่ตอนนี้</p></div><button class="btn primary" data-act="tenantForm">เพิ่มผู้เช่าใหม่</button></div>
  <div class="chips"><button class="chip" data-act="tFilter" data-f="active" aria-pressed="${f === 'active'}">พักอยู่</button><button class="chip" data-act="tFilter" data-f="moved" aria-pressed="${f !== 'active'}">ย้ายออกแล้ว</button></div>
  ${list.length ? `<div class="cards">${list.map(t => {
    const r = roomById(t.roomId), left = t.contractEnd ? daysBetween(today, t.contractEnd) : null;
    const cpill = t.status !== 'active' ? `<span class="pill p-idle">ย้ายออก ${dateLabel(t.moveOut)}</span>` : left === null ? '' : left < 0 ? '<span class="pill p-bad">หมดสัญญาแล้ว</span>' : left <= 30 ? `<span class="pill p-warn">สัญญาเหลือ ${left} วัน</span>` : '<span class="pill p-ok">สัญญาปกติ</span>';
    return `<div class="card"><div class="top"><div><h3>${esc(t.name)}</h3><div class="small muted">${esc(t.phone || '')}</div></div>${tag(r?.no || '-')}</div>
    <dl class="kv"><dt>เข้าพัก</dt><dd>${dateLabel(t.moveIn)}</dd><dt>สิ้นสุดสัญญา</dt><dd>${dateLabel(t.contractEnd)}</dd><dt>เงินประกัน</dt><dd class="num">${baht(t.deposit)} บาท</dd>
    ${t.status !== 'active' ? `<dt>คืนประกัน</dt><dd class="num">${baht(t.refund)} บาท</dd>` : ''}${t.emergencyName ? `<dt>ติดต่อฉุกเฉิน</dt><dd>${esc(t.emergencyName)} ${esc(t.emergencyPhone || '')}</dd>` : ''}</dl>
    <div class="row" style="justify-content:space-between">${cpill}<div class="row"><button class="btn sm" data-act="tenantForm" data-id="${t.id}">แก้ไข</button>${t.status === 'active' ? `<button class="btn sm" data-act="moveOut" data-id="${t.id}">ย้ายออก</button>` : ''}</div></div></div>`;
  }).join('')}</div>` : `<div class="panel empty">${f === 'active' ? 'ยังไม่มีผู้เช่า กด "เพิ่มผู้เช่าใหม่" เพื่อทำสัญญา' : 'ยังไม่มีประวัติผู้ย้ายออก'}</div>`}`;
}
function tenantForm(id, roomId) {
  const t = id ? {id, ...S.tenants[id]} : {name: '', phone: '', idCard: '', emergencyName: '', emergencyPhone: '', roomId: roomId || '', moveIn: todayStr(), contractMonths: 12, deposit: '', note: '', moveOutPlanned: ''};
  const choices = rooms().filter(r => r.id === t.roomId || roomState(r) === 'vacant');
  if (!id && !choices.length) { toast('ไม่มีห้องว่าง เพิ่มห้องหรือย้ายผู้เช่าออกก่อน'); return; }
  const defRent = roomById(t.roomId || choices[0]?.id)?.rent || 0;
  modal(`<header><h2>${id ? 'แก้ไขข้อมูลผู้เช่า' : 'ผู้เช่าใหม่และสัญญาเช่า'}</h2><button class="x" data-act="close" aria-label="ปิด">×</button></header>
  <form class="f" id="tenF">
    <div class="fld"><label for="tf-name">ชื่อ-นามสกุล</label><input id="tf-name" name="name" required value="${esc(t.name)}"></div>
    <div class="fld"><label for="tf-phone">เบอร์โทร</label><input id="tf-phone" name="phone" inputmode="tel" value="${esc(t.phone)}"></div>
    <div class="fld"><label for="tf-id">เลขบัตรประชาชน</label><input id="tf-id" name="idCard" inputmode="numeric" value="${esc(t.idCard)}"></div>
    <div class="fld"><label for="tf-room">ห้อง</label><select id="tf-room" name="roomId" required ${id && t.status !== 'active' ? 'disabled' : ''}>${choices.map(r => `<option value="${r.id}" ${r.id === t.roomId ? 'selected' : ''}>${esc(r.no)} · ${baht(r.rent)} บาท</option>`).join('')}</select></div>
    <div class="fld"><label for="tf-en">ผู้ติดต่อฉุกเฉิน</label><input id="tf-en" name="emergencyName" value="${esc(t.emergencyName)}"></div>
    <div class="fld"><label for="tf-ep">เบอร์ผู้ติดต่อฉุกเฉิน</label><input id="tf-ep" name="emergencyPhone" inputmode="tel" value="${esc(t.emergencyPhone)}"></div>
    <div class="fld"><label for="tf-in">วันเข้าพัก</label><input id="tf-in" name="moveIn" type="date" required value="${esc(t.moveIn)}"></div>
    <div class="fld"><label for="tf-months">ระยะสัญญา (เดือน)</label><input id="tf-months" name="contractMonths" type="number" min="1" value="${esc(t.contractMonths)}"><span class="hint" id="tf-endHint"></span></div>
    <div class="fld"><label for="tf-dep">เงินประกัน (บาท)</label><input id="tf-dep" name="deposit" type="number" min="0" value="${esc(t.deposit === '' ? defRent * 2 : t.deposit)}"><span class="hint">ค่าเริ่มต้นคือค่าเช่า 2 เดือน</span></div>
    ${id && t.status === 'active' ? `<div class="fld"><label for="tf-mop">แจ้งย้ายออกวันที่ (ถ้ามี)</label><input id="tf-mop" name="moveOutPlanned" type="date" value="${esc(t.moveOutPlanned || '')}"></div>` : ''}
    <div class="fld wide"><label for="tf-note">หมายเหตุ</label><input id="tf-note" name="note" value="${esc(t.note)}"></div>
  </form>
  <div class="actions">${id ? `<button class="btn danger" data-act="tenantDelete" data-id="${id}" data-confirm="1">ลบประวัติ</button>` : ''}<button class="btn" data-act="close">ยกเลิก</button><button class="btn primary" data-act="tenantSave" data-id="${id || ''}">บันทึก</button></div>`, box => {
    const upd = () => { const e = contractEnd($('#tf-in', box).value, +$('#tf-months', box).value); $('#tf-endHint', box).textContent = e ? 'สิ้นสุดสัญญา ' + dateLabel(e) : ''; };
    $('#tf-in', box).addEventListener('input', upd); $('#tf-months', box).addEventListener('input', upd); upd();
  });
}
const contractEnd = (start, months) => start && months > 0 ? addDays(addMonths(start.slice(0, 7), months) + start.slice(7), -1) : '';
async function tenantSave(id) {
  const f = $('#tenF'); if (!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f));
  const old = id ? S.tenants[id] : {status: 'active', createdAt: todayStr()};
  const data = {...old, name: d.name.trim(), phone: d.phone.trim(), idCard: d.idCard.trim(), emergencyName: d.emergencyName.trim(), emergencyPhone: d.emergencyPhone.trim(),
    roomId: d.roomId || old.roomId, moveIn: d.moveIn, contractMonths: +d.contractMonths || 0, contractEnd: contractEnd(d.moveIn, +d.contractMonths), deposit: +d.deposit || 0, note: d.note.trim(), moveOutPlanned: d.moveOutPlanned || ''};
  closeModal(); if (await put('tenants', id || 't' + uid(), data)) toast('บันทึกข้อมูล ' + data.name + ' แล้ว');
}
function moveOutForm(id) {
  const t = S.tenants[id], r = roomById(t.roomId);
  const owed = withId('bills').filter(b => b.tenantId === id && b.status !== 'paid').reduce((s, b) => s + billTotal(b), 0);
  modal(`<header><h2>ย้ายออก · ${esc(t.name)}</h2><button class="x" data-act="close" aria-label="ปิด">×</button></header>
  <p class="muted" style="margin:0">ห้อง ${esc(r?.no)} · เงินประกัน ${baht(t.deposit)} บาท${owed ? ` · <span style="color:var(--bad)">มีบิลค้าง ${baht(owed)} บาท</span>` : ''}</p>
  <form class="f" id="moF">
    <div class="fld"><label for="mo-date">วันที่ย้ายออก</label><input id="mo-date" name="moveOut" type="date" required value="${esc(t.moveOutPlanned || todayStr())}"></div>
    <div class="fld"><label for="mo-ded">หักค่าเสียหาย/ทำความสะอาด (บาท)</label><input id="mo-ded" name="deduct" type="number" min="0" value="0"></div>
    <div class="fld"><label for="mo-owed">หักบิลค้างชำระ (บาท)</label><input id="mo-owed" name="owed" type="number" min="0" value="${round2(owed)}"></div>
    <div class="fld"><label>คืนเงินประกัน</label><div class="num" id="mo-refund" style="font-size:1.4rem;font-weight:600"></div></div>
    <div class="fld wide"><label for="mo-note">หมายเหตุ</label><input id="mo-note" name="moveOutNote" placeholder="เช่น ผนังมีรอยต้องทาสี"></div>
  </form>
  <div class="actions"><button class="btn" data-act="close">ยกเลิก</button><button class="btn primary" data-act="moveOutSave" data-id="${id}">ยืนยันย้ายออก</button></div>`, box => {
    const upd = () => { $('#mo-refund', box).textContent = baht(Math.max(0, (+t.deposit || 0) - (+$('#mo-ded', box).value || 0) - (+$('#mo-owed', box).value || 0))) + ' บาท'; };
    box.addEventListener('input', upd); upd();
  });
}
async function moveOutSave(id) {
  const f = $('#moF'); if (!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f)), t = S.tenants[id];
  const refund = Math.max(0, (+t.deposit || 0) - (+d.deduct || 0) - (+d.owed || 0));
  closeModal();
  if (await put('tenants', id, {...t, status: 'moved', moveOut: d.moveOut, deduct: +d.deduct || 0, owedDeducted: +d.owed || 0, refund, moveOutNote: d.moveOutNote.trim(), moveOutPlanned: ''})) toast('บันทึกย้ายออกแล้ว คืนประกัน ' + baht(refund) + ' บาท');
}

/* ---------- meters ---------- */
function viewMeters() {
  const m = ui.month, st = settings();
  const rs = rooms().filter(r => roomState(r) === 'occ' || readingOf(r.id, m));
  const done = rs.filter(r => readingOf(r.id, m)).length;
  const billable = rs.filter(r => readingOf(r.id, m) && tenantOf(r.id) && !billOf(r.id, m)).length;
  return `<div class="head"><div><h2>จดมิเตอร์น้ำไฟ</h2><p>จดแล้ว ${done} จาก ${rs.length} ห้อง · น้ำหน่วยละ ${baht(st.waterRate)} บาท · ไฟหน่วยละ ${baht(st.elecRate)} บาท</p></div>
  <div class="row">${monthPicker()}<button class="btn primary" data-act="genBills" ${billable ? '' : 'disabled'}>ออกบิล ${billable ? billable + ' ห้อง' : ''}</button></div></div>
  ${rs.length ? `<div class="tablewrap"><table><thead><tr><th>ห้อง</th><th>ผู้เช่า</th><th class="r">น้ำ ครั้งก่อน</th><th class="r">น้ำ ล่าสุด</th><th class="r">ใช้ (ลบ.ม.)</th><th class="r">ไฟ ครั้งก่อน</th><th class="r">ไฟ ล่าสุด</th><th class="r">ใช้ (kWh)</th><th>สถานะ</th></tr></thead><tbody>
  ${rs.map(r => {
    const cur = readingOf(r.id, m), p = prevReading(r, m), u = usage(r, m), b = billOf(r.id, m), lock = !!b;
    const neg = u && (u.w < 0 || u.e < 0);
    return `<tr data-room="${r.id}"><td>${tag(r.no)}</td><td>${esc(tenantOf(r.id)?.name || '-')}</td>
    <td class="r num muted">${baht(p.water)}</td><td class="r"><input id="mw-${r.id}" data-meter="water" type="number" min="0" step="any" inputmode="decimal" value="${cur ? esc(cur.water) : ''}" ${lock ? 'disabled' : ''} aria-label="มิเตอร์น้ำห้อง ${esc(r.no)}"></td><td class="r num">${u ? baht(u.w) : '-'}</td>
    <td class="r num muted">${baht(p.elec)}</td><td class="r"><input id="me-${r.id}" data-meter="elec" type="number" min="0" step="any" inputmode="decimal" value="${cur ? esc(cur.elec) : ''}" ${lock ? 'disabled' : ''} aria-label="มิเตอร์ไฟห้อง ${esc(r.no)}"></td><td class="r num">${u ? baht(u.e) : '-'}</td>
    <td>${b ? `<button class="btn sm" data-act="bill" data-id="${b.id}">ออกบิลแล้ว</button>` : neg ? '<span class="warnText">เลขน้อยกว่าครั้งก่อน</span>' : cur ? '<span class="pill p-ok">จดแล้ว</span>' : '<span class="pill p-acc">รอจด</span>'}</td></tr>`;
  }).join('')}</tbody></table></div><p class="small muted">พิมพ์เลขมิเตอร์แล้วกด Tab หรือแตะช่องอื่น ระบบจะบันทึกเองเมื่อกรอกครบทั้งน้ำและไฟ ห้องที่ออกบิลแล้วจะแก้เลขไม่ได้ ถ้าต้องแก้ให้ลบบิลนั้นก่อน</p>`
  : '<div class="panel empty">ยังไม่มีห้องที่มีผู้เช่า</div>'}`;
}
async function saveMeterRow(tr) {
  const roomId = tr.dataset.room, w = $('[data-meter=water]', tr).value, e = $('[data-meter=elec]', tr).value;
  if (w === '' || e === '') return;
  const id = roomId + '_' + ui.month, old = S.readings[id];
  if (old && +old.water === +w && +old.elec === +e) return;
  await put('readings', id, {roomId, month: ui.month, water: +w, elec: +e, readAt: todayStr()});
}
async function genBills() {
  const m = ui.month, st = settings(); let n = 0;
  for (const r of rooms()) {
    const t = tenantOf(r.id), u = usage(r, m);
    if (!t || !u || billOf(r.id, m)) continue;
    const items = [{label: 'ค่าเช่าห้อง', amount: +r.rent || 0},
      {label: `ค่าน้ำ ${baht(u.w)} หน่วย × ${baht(st.waterRate)}`, amount: round2(Math.max(u.w * st.waterRate, +st.waterMin || 0))},
      {label: `ค่าไฟ ${baht(u.e)} หน่วย × ${baht(st.elecRate)}`, amount: round2(u.e * st.elecRate)}];
    if (+st.commonFee > 0) items.push({label: 'ค่าส่วนกลาง', amount: +st.commonFee});
    if (+st.internetFee > 0) items.push({label: 'ค่าอินเทอร์เน็ต', amount: +st.internetFee});
    const bill = {roomId: r.id, roomNo: r.no, tenantId: t.id, tenantName: t.name, month: m, items, waterUnits: u.w, elecUnits: u.e,
      dueDate: addMonths(m, 1) + '-' + p2(Math.min(28, Math.max(1, +st.dueDay || 5))), status: 'unpaid', createdAt: todayStr(), no: 'INV' + m.replace('-', '') + '-' + r.no};
    bill.total = billTotal(bill);
    if (await put('bills', r.id + '_' + m, bill)) n++;
  }
  toast(n ? `ออกบิล ${n} ห้องแล้ว` : 'ไม่มีห้องที่พร้อมออกบิล');
}

/* ---------- bills ---------- */
function viewBills() {
  const m = ui.month, f = ui.billFilter;
  const all = withId('bills').filter(b => b.month === m).sort((a, b) => String(a.roomNo).localeCompare(String(b.roomNo), 'th', {numeric: true}));
  const list = all.filter(b => f === 'all' || (f === 'paid' ? b.status === 'paid' : b.status !== 'paid'));
  const sum = all.reduce((s, b) => s + billTotal(b), 0), paid = all.filter(b => b.status === 'paid').reduce((s, b) => s + billTotal(b), 0);
  const older = withId('bills').filter(b => b.month < m && b.status !== 'paid');
  return `<div class="head"><div><h2>บิลและการชำระ</h2><p>${all.length} บิล · ยอดรวม ${baht(sum)} บาท · เก็บแล้ว ${baht(paid)} บาท</p></div><div class="row">${monthPicker()}<button class="btn" data-act="go" data-v="meters">จดมิเตอร์และออกบิล</button><button class="btn" data-act="exportExcel">ส่งออก Excel</button></div></div>
  ${older.length ? `<div class="banner warn"><span>ยังมีบิลเดือนก่อนค้างอยู่ ${older.length} บิล รวม ${baht(older.reduce((s, b) => s + billTotal(b), 0))} บาท</span><button class="btn sm" data-act="month" data-to="${older.sort((a, b) => a.month.localeCompare(b.month))[0].month}">ดูเดือนที่ค้าง</button></div>` : ''}
  <div class="chips">${[['all', 'ทั้งหมด'], ['unpaid', 'ยังไม่จ่าย'], ['paid', 'จ่ายแล้ว']].map(([k, t]) => `<button class="chip" data-act="bFilter" data-f="${k}" aria-pressed="${f === k}">${t}</button>`).join('')}</div>
  ${list.length ? `<div class="tablewrap"><table><thead><tr><th>ห้อง</th><th>ผู้เช่า</th><th class="r">น้ำ</th><th class="r">ไฟ</th><th class="r">ยอดรวม (บาท)</th><th>ครบกำหนด</th><th>สถานะ</th><th></th></tr></thead><tbody>
  ${list.map(b => `<tr><td>${tag(b.roomNo)}</td><td>${esc(b.tenantName)}</td><td class="r num">${baht(b.waterUnits)}</td><td class="r num">${baht(b.elecUnits)}</td><td class="r num"><b>${baht(billTotal(b))}</b></td><td>${dateLabel(b.dueDate)}</td><td>${billPill(b)}</td>
  <td class="r"><div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="bill" data-id="${b.id}">ดูบิล</button>${b.status !== 'paid' ? `<button class="btn sm primary" data-act="pay" data-id="${b.id}">รับชำระ</button>` : ''}</div></td></tr>`).join('')}
  </tbody></table></div>` : `<div class="panel empty">${all.length ? 'ไม่มีบิลในตัวกรองนี้' : 'ยังไม่ได้ออกบิลของเดือนนี้ ไปที่หน้าจดมิเตอร์เพื่อจดเลขแล้วกดออกบิล'}</div>`}`;
}
function billText(b) {
  const st = settings();
  return `${st.dormName}\nบิลค่าเช่าห้อง ${b.roomNo} · ${monthLabel(b.month)}\nเลขที่ ${b.no}\n\n` +
    (b.items || []).map(i => `${i.label}  ${baht(i.amount)} บาท`).join('\n') +
    `\n\nรวมทั้งสิ้น ${baht(billTotal(b))} บาท\nกรุณาชำระภายใน ${dateLabel(b.dueDate)}` + (st.promptpay ? `\nพร้อมเพย์ ${st.promptpay}` : '');
}
function billModal(id) {
  const b = {id, ...S.bills[id]}; if (!S.bills[id]) return;
  const editable = b.status !== 'paid';
  modal(`<header><div><h2>บิลห้อง ${esc(b.roomNo)} · ${monthLabel(b.month)}</h2><div class="small muted">${esc(b.tenantName)} · เลขที่ ${esc(b.no)}</div></div><button class="x" data-act="close" aria-label="ปิด">×</button></header>
  <div class="row">${billPill(b)}<span class="small muted">ครบกำหนด ${dateLabel(b.dueDate)}</span></div>
  <table class="bill-items"><tbody>${(b.items || []).map((i, k) => `<tr><td>${esc(i.label)}</td><td class="num">${baht(i.amount)}${editable && k > 2 ? ` <button class="btn sm" data-act="itemDel" data-id="${id}" data-k="${k}" aria-label="ลบรายการ">×</button>` : ''}</td></tr>`).join('')}</tbody></table>
  <div class="bill-total"><span>รวมทั้งสิ้น</span><span class="num">${baht(billTotal(b))} บาท</span></div>
  ${editable ? `<form class="f" id="itemF" style="grid-template-columns:2fr 1fr auto;align-items:end"><div class="fld"><label for="it-l">เพิ่มรายการอื่น</label><input id="it-l" name="label" placeholder="เช่น ค่าปรับจ่ายช้า"></div><div class="fld"><label for="it-a">จำนวนเงิน</label><input id="it-a" name="amount" type="number" step="any"></div><button class="btn" type="button" data-act="itemAdd" data-id="${id}">เพิ่ม</button></form>` :
    `<div class="banner info" style="margin:0"><span>รับชำระแล้ว ${dateLabel(b.paidAt)} · ${esc(b.method)} · ใบเสร็จเลขที่ ${esc(b.receiptNo)}</span></div>`}
  <div><div class="small muted" style="margin-bottom:6px">ข้อความสำหรับส่งให้ผู้เช่า (เช่น ทาง LINE)</div><pre class="copy" id="billTxt">${esc(billText(b))}</pre></div>
  <div class="actions">${editable ? `<button class="btn danger" data-act="billDelete" data-id="${id}" data-confirm="1">ลบบิล</button>` : `<button class="btn danger" data-act="unpay" data-id="${id}" data-confirm="1">ยกเลิกการรับชำระ</button>`}
  <button class="btn" data-act="copyBill">คัดลอกข้อความ</button>${editable ? `<button class="btn primary" data-act="pay" data-id="${id}">รับชำระ</button>` : ''}</div>`);
}
function payForm(id) {

async function clearSample() {

  toast(`ล้างข้อมูลตัวอย่าง ${n} รายการแล้ว เริ่มเพิ่มห้องจริงได้เลย`);

/* ---------- modal / toast ---------- */
let lastFocus = null;
function modal(html, mount) { lastFocus = document.activeElement; const box = $('#modalBox'); box.innerHTML = html; $('#modal').hidden = false; mount && mount(box); const f = box.querySelector('input:not([type=hidden]),select,textarea,button.primary'); f && f.focus(); }
function closeModal() { $('#modal').hidden = true; $('#modalBox').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 3200); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); } catch (e) { toast('คัดลอกอัตโนมัติไม่ได้ เลือกข้อความแล้วคัดลอกเองได้'); } }

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  if (ev.target === $('#modal')) { closeModal(); return; }
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.dataset.confirm && !el.dataset.armed) { el.dataset.armed = '1'; el.dataset.orig = el.textContent; el.textContent = 'กดอีกครั้งเพื่อยืนยัน'; setTimeout(() => { if (document.contains(el)) { delete el.dataset.armed; el.textContent = el.dataset.orig; } }, 3500); return; }
  const {act, id} = el.dataset;
  switch (act) {
    case 'go': ui.view = el.dataset.v; try { history.replaceState(null, '', '#' + ui.view); } catch (e) {} closeModal(); render(); window.scrollTo(0, 0); break;
    case 'month': ui.month = el.dataset.to || addMonths(ui.month, +el.dataset.k); render(); break;
    case 'close': closeModal(); break;
    case 'roomForm': roomForm(id); break;
    case 'roomSave': roomSave(id); break;
    case 'roomDelete': closeModal(); if (await remove('rooms', id)) toast('ลบห้องแล้ว'); break;
    case 'roomInfo': roomInfo(id); break;
    case 'tFilter': ui.tenantFilter = el.dataset.f; render(); break;
    case 'tenantForm': tenantForm(id, el.dataset.room); break;
    case 'tenantSave': tenantSave(id); break;
    case 'tenantDelete': closeModal(); if (await remove('tenants', id)) toast('ลบประวัติผู้เช่าแล้ว'); break;
    case 'moveOut': moveOutForm(id); break;
    case 'moveOutSave': moveOutSave(id); break;
    case 'genBills': el.disabled = true; await genBills(); break;
    case 'bFilter': ui.billFilter = el.dataset.f; render(); break;
    case 'bill': billModal(id); break;
    case 'pay': payForm(id); break;
    case 'paySave': paySave(id); break;
    case 'unpay': { const b = {...S.bills[id]}; ['paidAt', 'method', 'payNote', 'paidAmount', 'receiptNo'].forEach(k => delete b[k]); b.status = 'unpaid'; await put('bills', id, b); billModal(id); break; }
    case 'billDelete': closeModal(); if (await remove('bills', id)) toast('ลบบิลแล้ว แก้เลขมิเตอร์แล้วออกบิลใหม่ได้'); break;
    case 'itemAdd': { const l = $('#it-l').value.trim(), a = +$('#it-a').value; if (!l || !a) { toast('ใส่ชื่อรายการและจำนวนเงิน'); return; } const b = {...S.bills[id], items: [...S.bills[id].items, {label: l, amount: a}]}; b.total = billTotal(b); await put('bills', id, b); billModal(id); break; }
    case 'itemDel': { const items = S.bills[id].items.filter((_, k) => k !== +el.dataset.k); const b = {...S.bills[id], items}; b.total = billTotal(b); await put('bills', id, b); billModal(id); break; }
    case 'copyBill': copy($('#billTxt').textContent); break;
    case 'repairForm': repairForm(id, el.dataset.room); break;
    case 'repairSave': repairSave(id); break;
    case 'repairStep': await put('repairs', id, {...S.repairs[id], status: el.dataset.to}); break;
    case 'repairDone': repairDoneForm(id); break;
    case 'repairDoneSave': { const d = Object.fromEntries(new FormData($('#rdF'))); closeModal(); await put('repairs', id, {...S.repairs[id], status: 'done', doneAt: d.doneAt || todayStr(), cost: +d.cost || 0}); toast('ปิดงานซ่อมแล้ว'); break; }
    case 'repairDelete': closeModal(); await remove('repairs', id); break;
    case 'saveSettings': saveSettings(); break;
    case 'copyBackup': copy(JSON.stringify(S, null, 1)); break;
    case 'downloadBackup': { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'})); a.download = 'dorm-backup-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove(); break; }
    case 'clearSample': closeModal(); clearSample(); break;
    case 'exportExcel': el.disabled = true; await exportExcel(); el.disabled = false; break;
    case 'loginEmail': el.disabled = true; await loginEmail(); el.disabled = false; break;
    case 'loginGoogle': await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: redirectUrl()}}); break;
    case 'loginBack': loginSent = ''; render(); break;
    case 'signOut': await sb.auth.signOut(); break;
    case 'reload': location.reload(); break;
  }
});
document.addEventListener('change', ev => { const tr = ev.target.closest && ev.target.closest('tr[data-room]'); if (tr && ev.target.dataset.meter) saveMeterRow(tr); });
document.addEventListener('change', ev => {
  if (ev.target.id !== 'restoreFile' || !ev.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let o; try { o = JSON.parse(fr.result); if (!o || typeof o.rooms !== 'object') throw 0; } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบหอพัก'); return; }
    if (mode === 'cloud') {
      const rows = []; COLS.forEach(c => Object.entries(o[c] || {}).forEach(([id, data]) => rows.push({col: c, id, data})));
      toast('กำลังนำเข้า ' + rows.length + ' รายการ');
      try { await putMany(rows); await loadAll(); render(); toast('นำเข้าข้อมูลสำรองแล้ว'); } catch (e) { toast(cloudErr(e)); }
    } else { COLS.forEach(c => S[c] = o[c] || {}); saveLocal(); render(); toast('นำเข้าข้อมูลสำรองแล้ว'); }
    ev.target.value = '';
  };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'loginF') loginEmail(); });

    <form id="loginF" style="display:flex;flex-direction:column;gap:10px">
      <div class="fld"><label for="lg-email">อีเมล</label><input id="lg-email" name="email" type="email" required autocomplete="email" inputmode="email" placeholder="name@gmail.com"></div>
      <button class="btn ${CFG.googleLogin ? '' : 'primary'} big" data-act="loginEmail" type="button">ส่งลิงก์เข้าสู่ระบบทางอีเมล</button>
    </form>
    <p class="small muted" style="margin:0">เข้าสู่ระบบครั้งเดียว เครื่องนี้จะจำไว้ ครั้งต่อไปเปิดมาใช้ได้เลย</p>
  </div></div>`;
}
function viewDenied() {
  return `<div class="login"><div class="panel"><h2>บัญชีนี้ยังไม่ได้รับอนุญาต</h2>
  <p style="margin:0">คุณเข้าสู่ระบบด้วย <b>${esc(userEmail)}</b> แต่อีเมลนี้ยังไม่อยู่ในรายชื่อผู้ใช้ของหอพัก ส่งอีเมลนี้ให้ผู้ดูแลเพื่อเพิ่มสิทธิ์</p>
  <button class="btn big" data-act="signOut">ออกจากระบบ แล้วใช้อีเมลอื่น</button></div></div>`;
}
const redirectUrl = () => location.origin + location.pathname;
async function loginEmail() {
  const f = $('#loginF'); if (!f.reportValidity()) return;
  const email = $('#lg-email').value.trim();
  const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: redirectUrl()}});
  if (error) { toast(/rate|seconds/i.test(error.message) ? 'ส่งถี่เกินไป รอประมาณ 1 นาทีแล้วลองใหม่' : 'ส่งลิงก์ไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  loginSent = email; render();
}
async function startSession(session) {
  userEmail = session.user.email || '';
  mode = 'loading'; render();
  const {data, error} = await sb.from('allowed_users').select('email').limit(1);
  if (error) { mode = 'error'; render(); return; }
  if (!data.length) { mode = 'denied'; render(); return; }
  try { await loadAll(); } catch (e) { mode = 'error'; render(); return; }
  mode = 'cloud'; subscribeCloud(); render();
}

/* ---------- excel ---------- */
function loadScript(src) { return new Promise((ok, bad) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = bad; document.head.appendChild(t); }); }
async function exportExcel() {
  try { if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
  catch (e) { toast('โหลดตัวสร้างไฟล์ Excel ไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่'); return; }
  const rn = id => roomById(id)?.no || '';
  const stName = {occ: 'มีผู้เช่า', vacant: 'ว่าง', fix: 'ปิดซ่อม'};
  const sheets = {
    'ห้องพัก': rooms().map(r => ({'ห้อง': r.no, 'ชั้น': r.floor, 'ประเภท': r.type, 'ค่าเช่า': +r.rent || 0, 'สถานะ': stName[roomState(r)], 'ผู้เช่า': tenantOf(r.id)?.name || ''})),
    'ผู้เช่า': withId('tenants').map(t => ({'ชื่อ': t.name, 'ห้อง': rn(t.roomId), 'เบอร์โทร': t.phone, 'เลขบัตรประชาชน': t.idCard, 'ผู้ติดต่อฉุกเฉิน': [t.emergencyName, t.emergencyPhone].filter(Boolean).join(' '), 'วันเข้าพัก': t.moveIn, 'สิ้นสุดสัญญา': t.contractEnd, 'เงินประกัน': +t.deposit || 0, 'สถานะ': t.status === 'active' ? 'พักอยู่' : 'ย้ายออกแล้ว', 'วันย้ายออก': t.moveOut || '', 'คืนประกัน': t.refund ?? ''})),
    'บิล': withId('bills').sort((a, b) => (a.month + a.roomNo).localeCompare(b.month + b.roomNo, 'th', {numeric: true})).map(b => ({'เดือน': b.month, 'เลขที่บิล': b.no, 'ห้อง': b.roomNo, 'ผู้เช่า': b.tenantName, 'น้ำ (หน่วย)': b.waterUnits, 'ไฟ (หน่วย)': b.elecUnits, 'ยอดรวม': billTotal(b), 'ครบกำหนด': b.dueDate, 'สถานะ': BILL_PILL[billState(b)][1], 'วันที่จ่าย': b.paidAt || '', 'ช่องทาง': b.method || '', 'ใบเสร็จ': b.receiptNo || ''})),
    'มิเตอร์': Object.values(S.readings).sort((a, b) => (a.month + rn(a.roomId)).localeCompare(b.month + rn(b.roomId), 'th', {numeric: true})).map(r => ({'เดือน': r.month, 'ห้อง': rn(r.roomId), 'มิเตอร์น้ำ': r.water, 'มิเตอร์ไฟ': r.elec, 'วันที่จด': r.readAt})),
    'แจ้งซ่อม': withId('repairs').map(r => ({'วันที่แจ้ง': r.reportedAt, 'ห้อง': rn(r.roomId) || 'ส่วนกลาง', 'ปัญหา': r.title, 'รายละเอียด': r.detail, 'สถานะ': {new: 'รอดำเนินการ', doing: 'กำลังซ่อม', done: 'เสร็จแล้ว'}[r.status], 'วันที่เสร็จ': r.doneAt || '', 'ค่าใช้จ่าย': r.cost || ''}))
  };
  const wb = XLSX.utils.book_new();
  for (const [name, rows] of Object.entries(sheets)) { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]); XLSX.utils.book_append_sheet(wb, ws, name); }
  XLSX.writeFile(wb, 'dorm-' + todayStr() + '.xlsx');
}

const VIEW_FN = {dashboard: viewDashboard, rooms: viewRooms, tenants: viewTenants, meters: viewMeters, bills: viewBills, repairs: viewRepairs, settings: viewSettings};

/* ---------- boot ---------- */
async function boot() {
  render();
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) { mode = 'local'; loadLocal(); render(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (session && !started) { started = true; setTimeout(() => startSession(session)); }
    else if (!session) {
      started = false; userEmail = ''; if (channel) { sb.removeChannel(channel); channel = null; }
      COLS.forEach(c => S[c] = {}); mode = 'login'; render();
    }
  });
  const {data} = await sb.auth.getSession();
  if (!data.session && mode === 'loading') { mode = 'login'; render(); }
}
boot();
})();
</script>
